<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Manager</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <button class="panel-button" id="panel-button" onclick="alternarPainel()"></button>

    <header>
        <button class="search-icon-container" onclick="carregarPorNome()"><img class="icon" src="/imgs/lupa.png" alt=""></button>
        <input class="search" id="search" type="text">
    </header>

    <aside class="side-panel" id="side-panel">
        <div class="logo-icon-container">
            <img src="/imgs/icon.png" class="icon">
            <h1 class="logo">StockManager</h1>
        </div>
        <nav class="portal">
            <a href="#" class="here">Produtos</a>
        </nav>
    </aside>

    <main>
        <div class="main-button">
            <div class="main">
                <h1 class="main-title">Produtos</h1>
                <p class="main-page-desc">Gerencie todos os produtos do seu estoque por aqui</p>
            </div>
            <button class="add-button" onclick="novoProduto()">Novo <span clas="produto">Produto</span></button>
        </div>
        <table class="products-table" id="products-table">
            <thead>
                <tr class="table-header">
                    <th class="table-head">Produto</th>
                    <th class="table-only-xl table-head">Categoria</th>
                    <th class="table-head">Preço</th>
                    <th class="table-head">Estoque</th>
                    <th class="table-head">Ações</th>
                </tr>
            </thead>
            <tbody id="products-table-body"></tbody>
        </table>
    </main>

    <dialog class="new-product" id="new-product-dialog">
        <div class="title-desc">
            <h1 class="new-product-title">Novo Produto</h1>
            <p class="new-product-desc">Cadastrando novo produto</p>
        </div>
        <label class="form-label">Nome</label><br><input type="text" id="nome" class="form-input"><br>
        <label class="form-label">Categoria</label><br><input type="text" id="categoria" class="form-input"><br>
        <label class="form-label">Preço</label><br><input type="text" id="preco" class="form-input"><br>
        <label class="form-label">Estoque</label><br><input type="text" id="estoque" class="form-input"><br>
        <div class="buttons">
            <button onclick='addProduto()' class="confirm">Adicionar</button>
            <button onclick='fecharNovoProduto()' class="cancel">Cancelar</button>
        </div>
    </dialog>

    <dialog class="edit-product" id="edit-product-dialog">
        <div class="title-desc">
            <h1 class="product-title">Atualizar Produto</h1>
            <p class="product-desc">Atualizando produto já cadastrado</p>
        </div>
        <label class="form-label">Nome</label><br><input type="text" id="edit-nome" class="form-input" value=""><br>
        <label class="form-label">Categoria</label><br><input type="text" id="edit-categoria" class="form-input" value=""><br>
        <label class="form-label">Preço</label><br><input type="text" id="edit-preco" class="form-input" value=""><br>
        <label class="form-label">Estoque</label><br><input type="text" id="edit-estoque" class="form-input" value=""><br>
        <div class="buttons">
            <button onclick='editar()' id="edit-button" class="confirm">Atualizar</button>
            <button onclick='fecharEdicao()' class="cancel">Cancelar</button>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
