<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Manager</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <header>
    </header>

    <aside class="side-panel">
        <div class="logo-icon-container">
            <img src="/imgs/icon.png" class="icon">
            <h1 class="logo">StockManager</h1>
        </div>
        <nav class="portal">
            <a href="#" class="here">Produtos</a>
            <a href="estoques.html">Estoque</a>
        </nav>
    </aside>

    <main>
        <div class="main-button">
            <div class="main">
                <h1 class="main-title">Produtos</h1>
                <p class="main-page-desc">Gerencie todos os produtos do seu estoque por aqui</p>
            </div>
            <button class="add-button" onclick="newProduct()">Novo <span clas="produto">Produto</span></button>
        </div>
        <table class="products-table">
            <tr>
                <th class="table-only-xl">Código</th>
                <th>Produto</th>
                <th class="table-only-xl">Categoria</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
            </tr>
        </table>
    </main>

    <dialog class="new-product" id="new-product-dialog">
        <div class="title-desc">
            <h1 class="new-product-title">Novo Produto</h1>
            <p class="new-product-desc">Cadastrando novo produto</p>
        </div>
        <form action="" class="new-product-form">
            <label class="form-label">Nome</label><br><input type="text" id="nome" class="form-input"><br>
            <label class="form-label">Categoria</label><br><input type="text" id="categoria" class="form-input"><br>
            <label class="form-label">Preço</label><br><input type="text" id="preco" class="form-input"><br>
            <label class="form-label">Estoque</label><br><input type="text" id="estoque" class="form-input"><br>
            <div class="buttons">
                <button type="submit" class="add">Adicionar</button>
                <button type="button" class="cancel">Cancelar</button>
            </div>
        </form>
    </dialog>

    <script src="script.js" defer></script>
</body>

</html>
